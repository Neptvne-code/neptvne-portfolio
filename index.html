function openProj(m,n){const p=PROJ[n];if(!p){return}const b='progetti/'+p.slug+'/';

 let btn='';const dm=p.demo?(Array.isArray(p.demo)?p.demo:[p.demo]):[];dm.forEach((d,i)=>btn+='<a class="btn" target="_blank" href="'+b+d+'">Apri demo'+(dm.length>1?' '+(i+1):'')+' ↗</a>');
 (p.pdf||[]).forEach(x=>btn+='<a class="btn ghost" target="_blank" href="'+b+x[1]+'">'+x[0]+' ↗</a>');
 openPanel('<p class="kick" style="color:'+m.c+'">'+m.name+' · '+m.cat+'</p><h2>'+n+'</h2>'+
 '<div class="proj"><div><div class="gal">'+g+'</div></div><div class="meta"><h3>Ruolo</h3><p>'+p.ruolo+'</p><h3>Descrizione</h3><p>'+p.d+'</p><h3>Strumenti</h3><p>'+p.str+'</p><div class="btns">'+btn+'</div></div></div>');
 PC.querySelectorAll('.gal img').forEach(im=>im.onclick=()=>lb(p.img.map(f=>b+f),+im.dataset.i))}

const MENU_T=10.2;let B={};
function nav(t,p,tg){const dt=Math.min(.1,Math.max(0,t-lastT));lastT=t;
 const np=nep.position,f=tg.clone().sub(p).normalize(),rt=new V().crossVectors(f,new V(0,1,0)).normalize(),up=new V().crossVectors(rt,f).normalize();
 const tilt=up.clone().multiplyScalar(.42).add(f.clone().multiplyScalar(-.9)).normalize();B={f,rt,up,tilt};
 const k=ss((t-MENU_T)/1.6);
 MOONS.forEach(m=>{const a=m.ph+t*m.sp,d=lerp(1.2,m.d,k);m.mesh.visible=k>0;m.mesh.scale.setScalar(Math.max(.001,k));
  m.mesh.position.copy(np).add(rt.clone().multiplyScalar(Math.cos(a)*d*1.0)).add(tilt.clone().multiplyScalar(Math.sin(a)*d));m.mesh.rotation.y+=dt*.1;
  const v=fAm.get(m);fAm.set(m,v+((focus===m?1:0)-v)*Math.min(1,dt*2.2))});
 const tf=focus?1:0;fA+=(tf-fA)*Math.min(1,dt*2.2);
 let fm=focus||MOONS.reduce((x,y)=>fAm.get(x)>fAm.get(y)?x:y);const e=ss(Math.min(1,fA*1.02));
 if(e>0.0005){const mp=fm.mesh.position,dir=p.clone().sub(mp).normalize(),cp=mp.clone().add(dir.multiplyScalar(fm.r*8.5)).add(rt.clone().multiplyScalar(fm.r*2.5));
  p=p.clone().lerp(cp,e);tg=tg.clone().lerp(mp,e)}
 return[p,tg]}
function labels(t){const k=ss((t-MENU_T)/1.6),W=innerWidth,H=innerHeight;SK.classList.toggle('gone',t>MENU_T);document.body.classList.toggle('menu',k>.5);
 txt.style.opacity=parseFloat(txt.style.opacity||0)*(1-ss(fA*1.4));
 const pr=v=>{const s=v.clone().project(C);return[(s.x*.5+.5)*W,(-s.y*.5+.5)*H,s.z]};
 MOONS.forEach(m=>{const fa=fAm.get(m),mp=m.mesh.position,[x,y,z]=pr(mp);const dist=C.position.distanceTo(mp),rpx=m.r*k/dist/Math.tan(22.5*Math.PI/180)*H/2;
  const other=focus&&focus!==m;m.lab.style.cssText+=';left:'+x+'px;top:'+(y+rpx+10)+'px;opacity:'+(k*(other?.25:1))+';pointer-events:'+(k>.5?'auto':'none');
  m.hit.style.cssText='width:'+(rpx*2+16)+'px;height:'+(rpx*2+16)+'px;top:'+(-rpx*2-26)+'px';
  const sr=m.r*lerp(2.6,2.3,fa),n=m.sats.length;
  m.sats.forEach((d,j)=>{const a=j/n*6.2832+t*lerp(.35,.06,fa);const sp=mp.clone().add(B.rt.clone().multiplyScalar(Math.cos(a)*sr*1.3)).add(B.tilt.clone().multiplyScalar(Math.sin(a)*sr)).add(B.up.clone().multiplyScalar(Math.sin(a)*sr*fa*.9));
   const [sx,sy,sz]=pr(sp);d.style.left=sx+'px';d.style.top=sy+'px';d.style.opacity=k*(other?.0:(.55+.45*fa));d.classList.toggle('big',fa>.5);d.style.pointerEvents=k>.5&&!other?'auto':'none'})})}
window.__focus=id=>focusMoon(MOONS.find(m=>m.id===id));window.__proj=(id,n)=>openProj(MOONS.find(m=>m.id===id),n);window.__back=back;
