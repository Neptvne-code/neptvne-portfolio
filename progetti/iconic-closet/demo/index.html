</style><style>:root{--ink:#2a1840;--soft:#6a4f8a;--pink:#ff5fb0;--lilac:#b58cff;--cyan:#5fe8ff;--lime:#c9ff3d;--butter:#fff3b0;--card:#fff;--card2:#fbf5ff;--line:#2a1840;--bg1:#ffd1e8;--bg2:#d9c4f0;--bg3:#c2e9fb;--shadow:4px 4px 0 var(--ink);
 --disp:'Unbounded','Arial Black',system-ui,sans-serif;--body:'Quicksand','Trebuchet MS',system-ui,sans-serif;--pix:'VT323',ui-monospace,monospace}
body.dark{--ink:#f4eeff;--soft:#b9a6dc;--card:#211638;--card2:#2b1d49;--line:#b58cff;--bg1:#2a1247;--bg2:#1b1040;--bg3:#0f1f3d;--shadow:4px 4px 0 #b58cff55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--body);font-weight:600;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2) 45%,var(--bg3) 100%);background-size:200% 200%;animation:flow 24s ease-in-out infinite;overflow:hidden}
@keyframes flow{0%,100%{background-position:0 0}50%{background-position:100% 100%}}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3,h4,h5,p{margin:0}
.stage{height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;padding:16px;position:relative}
.stage::before,.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.7) 0 3px,transparent 4px),radial-gradient(circle at 80% 70%,rgba(255,255,255,.6) 0 4px,transparent 5px),radial-gradient(circle at 60% 10%,rgba(255,95,176,.35) 0 18px,transparent 19px),radial-gradient(circle at 10% 80%,rgba(95,232,255,.4) 0 26px,transparent 27px);}
.poster{width:340px;display:none;position:relative;z-index:1}
@media(min-width:1000px){.poster{display:block}}
.poster h1{font-family:var(--disp);font-weight:800;font-size:54px;line-height:.95;letter-spacing:-1px}
.poster p{margin-top:14px;font-size:17px;line-height:1.4}
.poster .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.poster .tags span{border:2.5px solid var(--ink);border-radius:99px;padding:5px 12px;background:var(--card);box-shadow:3px 3px 0 var(--ink);font-size:13px;font-weight:700}
.poster .px{font-family:var(--pix);font-size:22px;margin-top:20px;color:var(--soft)}
.chrome{background:linear-gradient(180deg,#fff 0%,#dfe6ff 35%,#8a78d8 50%,#f2e9ff 62%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;filter:drop-shadow(3px 3px 0 var(--pink))}
.chrome.pink{background:linear-gradient(180deg,#ffd9ec 0%,#ff7cc0 45%,#e03a98 52%,#ffb7dc 70%,#fff 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(3px 3px 0 var(--cyan))}
body.dark .chrome{-webkit-text-stroke:2.5px #0c0620}
.phone{position:relative;z-index:1;width:390px;height:min(844px,calc(100vh - 28px));border-radius:50px;border:10px solid #1b1030;box-shadow:0 0 0 2px #6b55a8,0 30px 70px rgba(60,20,110,.45),inset 0 0 0 2px #3a2a5e;background:linear-gradient(170deg,#fff5fb,#f1e6ff 50%,#e4f6ff);overflow:hidden;isolation:isolate}
body.dark .phone{background:linear-gradient(170deg,#1b1038,#241448 50%,#0f2142)}
.phone::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:104px;height:26px;border-radius:99px;background:#1b1030;z-index:60}
.status{position:absolute;top:10px;left:26px;right:26px;display:flex;justify-content:space-between;font-size:13px;font-weight:800;z-index:55;pointer-events:none}
.status span:last-child{font-family:var(--pix);font-size:18px;letter-spacing:1px;margin-top:-2px}
#app{position:absolute;inset:0}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:70;display:none}
@media(max-width:520px){.stage{padding:0}.phone{width:100vw;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}.phone::before{display:none}.status{display:none}}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:44px 18px 28px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.enter{animation:enter .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.icbtn{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;position:relative;color:var(--ink);padding:0;transition:transform .12s}
.icbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.icbtn.sm{width:34px;height:34px}.icbtn.ghost{visibility:hidden}.icbtn.on{background:var(--lime)}
.icbtn.flip svg{transform:scaleX(-1)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:99px;font-size:10px;min-width:18px;height:18px;display:grid;place-items:center;font-style:normal}
.lang{border:2.5px solid var(--ink);background:var(--card);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:800;letter-spacing:.5px;box-shadow:3px 3px 0 var(--ink);color:var(--soft)}
.lang b{color:#fff;background:linear-gradient(135deg,var(--pink),var(--lilac));border-radius:99px;padding:1px 6px;margin:0 1px}
.pips{display:flex;gap:6px;flex:1;justify-content:center}

.pips i.done{background:var(--lilac)}.pips i.cur{background:linear-gradient(90deg,var(--pink),var(--lilac));width:38px}
/* buttons */
.btn{position:relative;border:2.5px solid var(--ink);border-radius:99px;padding:12px 20px;background:linear-gradient(180deg,#ff8ccb,var(--pink) 55%,#e83f97);color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--ink);text-shadow:0 1px 0 rgba(42,24,64,.45);display:inline-flex;align-items:center;justify-content:center;gap:8px;overflow:hidden;transition:transform .1s,box-shadow .1s;text-decoration:none}
.btn::before{content:"";position:absolute;left:8%;right:8%;top:3px;height:44%;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.big{padding:15px 24px;font-size:17px;width:100%}
.btn.small{padding:7px 13px;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.btn.ghost{background:linear-gradient(180deg,#fff,var(--card2));color:var(--ink);text-shadow:none}
body.dark .btn.ghost{background:linear-gradient(180deg,#34255a,#261b45)}
.btn.ghost::before{opacity:.5}
.btn.danger{color:#d41b6b}
.btn.link{background:none;border:0;box-shadow:none;color:var(--soft);text-decoration:underline;text-shadow:none;padding:8px}.btn.link::before{display:none}
.btn[disabled]{filter:grayscale(.9);opacity:.5;pointer-events:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btnrow.tight{margin-top:6px;gap:6px}
.btnrow>.btn{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.fine{font-size:12.5px;line-height:1.45;color:var(--soft);font-weight:600;margin-top:6px}.fine.c{text-align:center}
.foot{position:sticky;bottom:-10px;padding:12px 0 4px;margin-top:10px;display:flex;flex-direction:column;gap:6px;}
body.dark .foot{--bg-fade:rgba(27,16,56,.95)}
/* window */
.win{border:2.5px solid var(--ink);border-radius:20px;background:var(--card);box-shadow:var(--shadow);margin-top:16px;overflow:hidden}
.wbar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:2.5px solid var(--ink);background:linear-gradient(90deg,var(--lilac),var(--cyan));color:#fff;font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.3px;text-shadow:0 1px 0 rgba(42,24,64,.5)}
.win.pink .wbar{background:linear-gradient(90deg,var(--pink),var(--lilac))}.win.cyan .wbar{background:linear-gradient(90deg,#3cc9ff,#7be8ff 70%,#b9f6ff)}.win.lime .wbar{background:linear-gradient(90deg,#8fd400,var(--lime));text-shadow:0 1px 0 rgba(42,24,64,.35)}
.wdots{display:flex;gap:4px}.wdots i{width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid var(--ink)}
.wtitle{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wx{font-size:15px}
.wbody{padding:14px}
.wbody h4,.wbody h5{font-family:var(--disp);font-size:11px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.5px;color:var(--soft)}
/* welcome */

.orb-wrap{position:relative;width:230px;height:230px;margin:0 auto}

@keyframes spin{to{transform:rotate(360deg)}}

.avatar{width:100%;height:100%;display:block;overflow:visible}

.s1{top:6px;left:10px}.s2{top:30px;right:6px;animation-delay:.6s}.s3{bottom:30px;left:0;animation-delay:1.1s}.s4{bottom:10px;right:20px;animation-delay:1.6s}

.logo{margin:6px 0 0;display:flex;flex-direction:column;align-items:center;line-height:.9}

.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--soft);font-weight:800}

.swgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;margin-top:12px}

.sw{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px;position:relative;font-size:10.5px;line-height:1.1;font-weight:700;color:var(--ink)}

.sw-c.eye{background:radial-gradient(circle,#150b22 0 20%,var(--c) 23% 62%,color-mix(in srgb,var(--c) 60%,#000) 100%)}

@keyframes pop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.metals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.metal{border:2.5px solid var(--ink);border-radius:18px;background:var(--card);box-shadow:3px 3px 0 var(--ink);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}

.drape-row{margin-top:10px}.dh{font-size:12.5px;color:var(--soft);text-align:center;font-weight:800}

.dpair.swapin{animation:swapin .4s cubic-bezier(.2,.9,.3,1.2)}.dpair.swapout{animation:swapout .26s forwards}
@keyframes swapin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}@keyframes swapout{to{opacity:0;transform:translateX(-30px) scale(.95)}}
.dcard{border:2.5px solid var(--ink);border-radius:26px;background:radial-gradient(circle at 50% 25%,#fff,var(--bg2));box-shadow:var(--shadow);padding:8px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s}

.dav{width:100%;aspect-ratio:240/270}.dlab{font-family:var(--disp);font-size:12px;font-weight:700;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:3px 12px}
.drape-g{animation:drapeIn .6s cubic-bezier(.2,.9,.3,1.1)}@keyframes drapeIn{from{transform:translateY(60px)}to{transform:none}}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}

.shape.sel{background:var(--butter);color:#2a1840;transform:translateY(-3px);box-shadow:3px 6px 0 var(--ink)}.shape.sel em{color:#6a4f8a}
/* analyzing */
.analyzing{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.spinwrap{position:relative;width:170px;height:170px;display:grid;place-items:center}.hanger{position:absolute;color:#fff;filter:drop-shadow(0 2px 0 var(--ink));animation:bob 1.6s ease-in-out infinite}
.analyzing h2{font-family:var(--disp);font-size:20px}
.an{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;text-align:left;font-size:13.5px;max-width:300px}
.an li{opacity:0;animation:fadeup .5s var(--d) forwards;display:flex;gap:9px;align-items:flex-start}
.an .tick{flex:none;width:22px;height:22px;border-radius:50%;background:var(--lime);border:2px solid var(--ink);display:grid;place-items:center;color:var(--ink)}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* reveal */
.reveal{background:linear-gradient(180deg,color-mix(in srgb,var(--g1) 38%,transparent),transparent 360px),radial-gradient(circle at 80% 8%,color-mix(in srgb,var(--g2) 35%,transparent),transparent 220px)}
.curtain{position:fixed;position:absolute;inset:0;z-index:40;background:conic-gradient(from 90deg at 50% 50%,var(--g1),var(--g2),var(--g3),var(--g1));display:grid;place-items:center;animation:curtain 1.5s .5s cubic-bezier(.7,0,.2,1) forwards;pointer-events:none;height:100vh}
.curtain span{animation:spin 1.2s linear infinite;display:block}
@keyframes curtain{0%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 100% 0)}}
.rv-hero{text-align:center;margin-top:6px}.rv-you{font-family:var(--pix);font-size:24px;letter-spacing:1.5px;color:var(--soft)}
.chrome-big{font-family:var(--disp);font-weight:800;font-size:38px;line-height:1.02;letter-spacing:-1.5px;margin:6px 0;background:linear-gradient(180deg,#fff 0%,#dbe3ff 34%,var(--g2,#8a78d8) 50%,#f4eaff 64%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;animation:shimmer 3.5s ease-in-out infinite;background-size:100% 200%;filter:drop-shadow(4px 4px 0 var(--g1,var(--pink)))}
.chrome-big.sm{font-size:24px;-webkit-text-stroke-width:2px;filter:drop-shadow(3px 3px 0 var(--g1,var(--pink)))}
@keyframes shimmer{0%,100%{background-position:0 0}50%{background-position:0 40%}}
.macro-line{font-family:var(--disp);font-size:12px;text-transform:uppercase;letter-spacing:1px}.mac-desc{font-size:13.5px;line-height:1.45;color:var(--soft);margin:8px 6px 0}
.sec{font-family:var(--disp);font-size:14px;margin-top:20px;text-align:center}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px;margin-top:12px}
.chip{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0;color:var(--ink)}
.cdot{width:58px;height:58px;border-radius:50%;background:var(--c);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);position:relative;display:block;transition:transform .15s}
.cdot::after{content:"";position:absolute;left:14%;top:9%;width:44%;height:28%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.75),transparent)}
.chip:active .cdot,.chip:hover .cdot{transform:scale(1.12) rotate(-6deg)}
.chip em{font-style:normal;font-size:10.5px;line-height:1.1;font-weight:700;text-align:center;max-width:76px}
.chip.pop{animation:popin .55s calc(2s + var(--i)*70ms) cubic-bezier(.2,1.6,.4,1) both}
.p12 .chip.pop{animation-delay:calc(1.6s + var(--i)*70ms)}
.profile .p12 .chip.pop,.shell .chip.pop{animation-delay:calc(var(--i)*40ms)}
@keyframes popin{from{opacity:0;transform:scale(0) rotate(-40deg)}to{opacity:1;transform:none}}
.chip.no .cdot{filter:saturate(.9)}.chip.no .cdot::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:linear-gradient(45deg,transparent 46%,#ff2f7a 46% 54%,transparent 54%)}
.cinfo{display:none;align-items:center;gap:12px;margin:12px 0 0;padding:10px 12px;border:2.5px dashed var(--ink);border-radius:16px;background:var(--card2)}.cinfo.on{display:flex;animation:enter .3s}

.domtxt{font-size:13.5px;line-height:1.45}

.al{display:flex;justify-content:space-between;font-size:10.5px;color:var(--soft);margin-top:3px;text-transform:uppercase;font-weight:800}
.confrow{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;font-weight:800}.confrow b{font-family:var(--pix);font-size:22px}
.cbar{position:relative;flex:1;height:12px;border:2.5px solid var(--ink);border-radius:99px;background:var(--card2);overflow:visible}.cbar u{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--lime),var(--cyan))}.cbar s{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--pink)}

.metalrow{display:flex;align-items:center;gap:8px;font-size:13.5px}
.cta{margin-top:22px}

.tb-r{display:flex;gap:8px;align-items:center}

function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255)}
function hex2lab(h){const [r,g,b]=hex2rgb(h).map(ungam);return xyz2lab([0.4124*r+0.3576*g+0.1805*b,0.2126*r+0.7152*g+0.0722*b,0.0193*r+0.1192*g+0.9505*b])}
/* Il gamut si rispetta riducendo la croma per bisezione (la tinta non si sposta) */
function lch2hex(L,C,h){
  let lo=0,hi=C;
  if(inGamut(lch2lab(L,C,h)))lo=C;
  else{for(let i=0;i<22;i++){const m=(lo+hi)/2;inGamut(lch2lab(L,m,h))?lo=m:hi=m}}
  const lab=lch2lab(L,lo,h);
  const hex=toHex(lab2rgbRaw(lab));
  const m=lab2lch(hex2lab(hex));            // valori effettivi, rimisurati dopo la conversione
  return{hex,L:m[0],C:m[1],h:m[2]};
}
function deltaE00(l1,l2){
  const [L1,a1,b1]=l1,[L2,a2,b2]=l2,rad=Math.PI/180;
  const C1=Math.hypot(a1,b1),C2=Math.hypot(a2,b2),Cb=(C1+C2)/2;
  const G=0.5*(1-Math.sqrt(Math.pow(Cb,7)/(Math.pow(Cb,7)+Math.pow(25,7))));
  const a1p=(1+G)*a1,a2p=(1+G)*a2,C1p=Math.hypot(a1p,b1),C2p=Math.hypot(a2p,b2);
  const hp=(b,a)=>{if(!b&&!a)return 0;let h=Math.atan2(b,a)/rad;return h<0?h+360:h};
  const h1p=hp(b1,a1p),h2p=hp(b2,a2p);
  const dLp=L2-L1,dCp=C2p-C1p;let dhp=0;
  if(C1p*C2p!==0){dhp=h2p-h1p;if(dhp>180)dhp-=360;else if(dhp<-180)dhp+=360}
  const dHp=2*Math.sqrt(C1p*C2p)*Math.sin(dhp*rad/2);
  const Lbp=(L1+L2)/2,Cbp=(C1p+C2p)/2;let hbp=h1p+h2p;
  if(C1p*C2p!==0){hbp=Math.abs(h1p-h2p)<=180?(h1p+h2p)/2:(h1p+h2p<360?(h1p+h2p+360)/2:(h1p+h2p-360)/2)}
  const T=1-0.17*Math.cos((hbp-30)*rad)+0.24*Math.cos(2*hbp*rad)+0.32*Math.cos((3*hbp+6)*rad)-0.20*Math.cos((4*hbp-63)*rad);
  const dth=30*Math.exp(-Math.pow((hbp-275)/25,2));
  const Rc=2*Math.sqrt(Math.pow(Cbp,7)/(Math.pow(Cbp,7)+Math.pow(25,7)));
  const Sl=1+0.015*Math.pow(Lbp-50,2)/Math.sqrt(20+Math.pow(Lbp-50,2)),Sc=1+0.045*Cbp,Sh=1+0.015*Cbp*T;
  const Rt=-Math.sin(2*dth*rad)*Rc;
  return Math.sqrt(Math.pow(dLp/Sl,2)+Math.pow(dCp/Sc,2)+Math.pow(dHp/Sh,2)+Rt*(dCp/Sc)*(dHp/Sh));
}
const hueDiff=(a,b)=>{let d=Math.abs(a-b)%360;return d>180?360-d:d};

/* Generazione palette: tinta interpolata sulla temperatura; valore sposta L (estremi meno);
   intensità moltiplica la croma 0,5×–1,5× (neutri meno). */
const _palCache={};
function seasonPalette(id){
  if(_palCache[id])return _palCache[id];
  const S=SEASON_BY_ID[id],[T,V,I]=S.vec,t=(T+1)/2,out=[];
  FAMILIES.forEach(f=>{
    let h0=f.cool,h1=f.warm;
    if(!f.neutral){let d=((h1-h0+540)%360)-180;h1=h0+d}
    let h=lerp(h0,h1,t);
    if(f.neutral){const u=clamp((t-0.38)/0.24,0,1);h=h0+(h1-h0)*u*u*(3-2*u)}
    h=((h%360)+360)%360;
    GRADES.forEach((g,gi)=>{
      const react=[0.5,1,0.45][gi],shift=f.neutral?7:9;
      let L=f.L[gi]+V*shift*react;
      L=clamp(L,gi===2?12:20,gi===0?97:92);
      const km=f.neutral?0.22:0.5;let C=f.C[gi]*(1+km*I);if(f.neutral)C*=0.35+0.65*Math.min(1,Math.abs(2*t-1)/0.4);
      const col=lch2hex(L,C,h);
      out.push({fam:f.id,grade:g,gi,hex:col.hex,L:col.L,C:col.C,h:col.h,name:COLOR_NAMES[f.id][gi][t<0.5?0:1]});
    });
  });
  return _palCache[id]=out;
}
/* i 12 colori del reveal = stessi esadecimali della guida (campo "reveal"): 10 medie + neutro chiaro e scuro */
function revealColors(id){const p=seasonPalette(id);return p.filter(c=>c.gi===1).concat([p.find(c=>c.fam==='neutri'&&c.gi===0),p.find(c=>c.fam==='neutri'&&c.gi===2)])}
function oppositeSeason(id){const v=SEASON_BY_ID[id].vec.map(x=>-x);return SEASONS.slice().sort((a,b)=>dist3(a.vec,v)-dist3(b.vec,v))[0].id}
const dist3=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
function avoidColors(id,n=6){
  const own=seasonPalette(id).map(c=>hex2lab(c.hex)),opp=seasonPalette(oppositeSeason(id)).filter(c=>c.gi!==0||c.fam==='neutri');
  const ranked=opp.map(c=>({c,d:Math.min(...own.map(o=>deltaE00(o,hex2lab(c.hex))))})).sort((a,b)=>b.d-a.d);
  const used={},res=[];ranked.forEach(r=>{if(res.length<n&&!used[r.c.fam]&&r.c.fam!=='neutri'){used[r.c.fam]=1;res.push(r.c)}});return res;
}
/* distanza di un colore dalla palette di una stagione */
function paletteFit(hex,seasonId){
  const lab=hex2lab(hex),pal=seasonPalette(seasonId);let best=1e9,bc=null;
  pal.forEach(c=>{const d=deltaE00(lab,hex2lab(c.hex));if(d<best){best=d;bc=c}});
  return{dE:best,color:bc};
}
function fitScore(dE){return dE<=7?100:dE<=22?Math.round(100-(dE-7)*(55/15)):Math.max(0,Math.round(45-(dE-22)*2.5))}
function colorFamily(hex){
  const [L,C,h]=lab2lch(hex2lab(hex));
  if(C<9||L>95||(L<16&&C<16))return 'neutri';
  if(h>=25&&h<85&&((C<38&&L<66)||(C<26&&L<84)))return 'marrone';
  if(h>=25&&h<75){return h<42?'rosso':'arancio'}
  if(h>=75&&h<108)return 'giallo';
  if(h>=108&&h<178)return 'verde';
  if(h>=178&&h<240)return 'turchese';
  if(h>=240&&h<305)return C<14?'neutri':'blu';
  if(h>=305&&h<335)return 'viola';
  return (h>=345||h<25)&&C>55&&L<60&&h<25?'rosso':'rosa';
}
function bestSeasonsFor(hex,n=3){
  return SEASONS.map(s=>({id:s.id,dE:paletteFit(hex,s.id).dE})).sort((a,b)=>a.dE-b.dE).slice(0,n);
}

/* ---------- MOTORE v0.2 ---------- */
const ENGINE={version:'0.2',
  W_TEMP:{skin:0.30,hair:0.25,eyes:0.45},
  CAL:{T:{off:0.129,gain:0.99},V:{off:-0.065,gain:1.27},C:{off:0.216,gain:1.36}},
  ABSOLUTE_BELOW:22, DOM_SPAN:0.18};
function computeProfile(inp){
  const skin=SKINS.find(s=>s.id===inp.skin),eye=EYES.find(s=>s.id===inp.eyes),hair=HAIRS.find(s=>s.id===inp.hair);
  const drape=inp.drape||[0,0,0],Tskin=(drape[0]+drape[1]+drape[2])/3;
  const W=ENGINE.W_TEMP;
  const rawT=W.skin*Tskin+W.hair*hair.T+W.eyes*eye.T;
  const vS=(skin.L-58)/28,vH=clamp((hair.L-32)/30,-1,1),vE=clamp((eye.L-45)/25,-1.2,1.2);
  const rawV=0.40*vS+0.35*vH+0.25*vE-0.062;
  const contrast=Math.abs(skin.L-hair.L)*0.7+Math.abs(skin.L-eye.L)*0.3;
  const rawC=0.216+2.2*((0.34*eye.cl+0.50*(contrast/70)+0.16*clamp(hair.L<20?0.7:0.2,0,1)-0.05)-0.338);
  const cal=(raw,c)=>clamp((raw-c.off)*c.gain,-1,1);
  const T=cal(rawT,ENGINE.CAL.T),V=cal(rawV,ENGINE.CAL.V),C=cal(rawC,ENGINE.CAL.C);
  // 4. assegnazione: macro per direzione, sottostagione per asse dominante
  const sc={};Object.keys(MACRO).forEach(m=>{const s=MACRO[m].sign;sc[m]=s[0]*T+s[1]*V+s[2]*C});
  const macros=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]),macro=macros[0];
  const s=MACRO[macro].sign,al=[s[0]*T,s[1]*V,s[2]*C],ord=[0,1,2].sort((a,b)=>al[b]-al[a]);
  const gap=al[ord[0]]-al[ord[1]],confidence=Math.round(100*clamp(gap/ENGINE.DOM_SPAN,0,1));
  const isAbs=confidence<ENGINE.ABSOLUTE_BELOW,axis=isAbs?'A':['T','V','C'][ord[0]];
  const season=macro+'-'+axis;
  const macroConf=Math.round(100*clamp((sc[macros[0]]-sc[macros[1]])/0.8,0,1));
  const ranked=SEASONS.map(x=>({id:x.id,d:dist3(x.vec,[T,V,C])})).sort((a,b)=>a.d-b.d);
  const second=ranked.find(r=>r.id!==season);
  const level=contrast>=34?'high':contrast>=17?'mid':'low';
  const metals=T>0.18?'gold':T<-0.18?'silver':'both';
  return{season,macro,axis,T,V,C,rawT,rawV,rawC,confidence,macroConf,isAbs,contrast:Math.round(contrast*10)/10,contrastLevel:level,
    ITA:Math.round(skin.ITA*10)/10,phototype:skin.photo,second:second.id,metals,Tskin,
    parts:{skin,hair,eye},aligned:al,dom:ord[0]};
}

/* Silhouette parametrica: spalle, vita, fianchi (0–1) */
function silhouette(sh,wa,hi,color='#b78cff'){
  const c=100,s=sh*46,w=wa*46,h=hi*46,id='sg'+Math.round(sh*100)+Math.round(wa*100)+Math.round(hi*100);
  const R=[[9,24],[[s*.5,26],[s*.95,30],[s,46]],[[s+2,62],[s*.82,76],[s*.8,90]],[[s*.78,104],[w+1,110],[w,126]],[[w-1,142],[h,148],[h,172]],[[h+1,196],[h*.86,228],[h*.8,254]],'L',[h*.8-15,254],[[h*.58,226],[7,222],[4,198]]];
  // metà destra
  let d=`M${c+9} 24`,pts=[[9,24]];
  const segs=[];
  for(let i=1;i<R.length;i++){const e=R[i];if(e==='L'){const p=R[i+1];segs.push({l:1,e:p});i++}else segs.push({c1:e[0],c2:e[1],e:e[2]})}
  let cur=[9,24];const rightSegs=[];
  segs.forEach(g=>{rightSegs.push({from:cur,g});cur=g.e});
  segs.forEach(g=>{d+=g.l?` L${c+g.e[0]} ${g.e[1]}`:` C${c+g.c1[0]} ${g.c1[1]} ${c+g.c2[0]} ${g.c2[1]} ${c+g.e[0]} ${g.e[1]}`});
  d+=` L${c} 196`;
  // metà sinistra: percorso inverso specchiato
  for(let i=rightSegs.length-1;i>=0;i--){const {from,g}=rightSegs[i];
    d+=g.l?` L${c-from[0]} ${from[1]}`:` C${c-g.c2[0]} ${g.c2[1]} ${c-g.c1[0]} ${g.c1[1]} ${c-from[0]} ${from[1]}`}
  d+='Z';
  return `<svg viewBox="0 0 200 262" class="sil"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="${color}"/></linearGradient></defs>
  <g stroke="#2a1840" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><path d="M${c-s+2} 52 L${c-s-12} 130 M${c+s-2} 52 L${c+s+12} 130" stroke-width="15" fill="none" stroke="#2a1840"/><path d="M${c-s+2} 52 L${c-s-12} 130 M${c+s-2} 52 L${c+s+12} 130" stroke-width="10.5" fill="none" stroke="url(#${id})"/>
  <circle cx="${c}" cy="10" r="13" fill="url(#${id})"/><path d="${d}" fill="url(#${id})"/></g></svg>`;
}

const hashS=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0)};
/* meteo simulato ma coerente col mese */
function weather(ds){
  const d=parseD(ds),m=d.getMonth(),base=[8,9,12,16,20,25,28,28,24,18,13,9][m],h=hashS(ds);
  const temp=Math.round(base+((h%7)-3)),r=(h>>3)%10,cond=r<2?'rain':r<5?'cloud':'sun';

function outfitItems(o){return Object.values(o.slots||o).filter(Boolean).map(id=>typeof id==='string'?S.items.find(i=>i.id===id):id).filter(Boolean)}
function isComplete(items){const c=x=>items.some(i=>i.cat===x);return c('dress')||(c('top')&&c('bottom'))}
function evaluate(items,ctx={}){
  const prof=S.profile,occ=ctx.occ&&ctx.occ!=='any'?ctx.occ:null,wx=ctx.wx;
  const R=[];let total=0,wsum=0;
  const add=(key,score,w,good,params,extra)=>{R.push(Object.assign({key,score,w,good,params},extra||{}));total+=score*w;wsum+=w};
  const P=pal();
  // 1. fit palette
  let fs=0,fw=0,worst=null;
  items.forEach(it=>{const f=itemFit(it),w=NEAR_FACE[it.cat]||0.3;fs+=f.score*w;fw+=w;if(!worst||f.score*Math.pow(w+0.4,-1)<worst.v)worst={it,f,v:f.score/(w+0.4)}});
  const fitAvg=fw?fs/fw:50;
  add('fit',fitAvg,0.34,fitAvg>=70,{});
  // dettagli fit
  const faceItems=items.filter(i=>(NEAR_FACE[i.cat]||0)>=0.8);
  const best=faceItems.map(i=>({i,f:itemFit(i)})).sort((a,b)=>a.f.dE-b.f.dE)[0];
  const sugg=()=>{const free=P.filter(c=>c.gi===1&&c.fam!=='neutri');const c=free[(hashS(items.map(i=>i.id).join())+1)%free.length];return L(c.name)};
  if(best&&best.f.level==='in')R.push({key:'r_fit_good',good:true,imp:fitAvg,params:{item:nm(best.i),color:L(best.f.color.name),d:best.f.dE.toFixed(1),near:t('r_near_face')}});
  else if(best&&best.f.level==='near')R.push({key:'r_fit_mixed',good:true,imp:55,params:{item:nm(best.i),color:L(best.f.color.name),d:best.f.dE.toFixed(1),sugg:sugg()}});
  if(worst&&worst.f.level==='off'){const near=(NEAR_FACE[worst.it.cat]||0)>=0.8;R.push(near?{key:'r_fit_bad',good:false,imp:90,params:{item:nm(worst.it),d:worst.f.dE.toFixed(1),sugg:sugg()}}:{key:'r_fit_bad_far',good:true,imp:35,params:{item:nm(worst.it),d:worst.f.dE.toFixed(1)}})}
  else if(items.length>1&&items.every(i=>itemFit(i).level!=='off')&&!(best&&best.f.level==='in'))R.push({key:'r_fit_all',good:true,imp:60,params:{d:(items.reduce((a,i)=>a+itemFit(i).dE,0)/items.length).toFixed(1)}});
  // 2. armonia
  const chrom=items.filter(i=>!['shoes','bag'].includes(i.cat)||true).map(i=>({i,lch:lab2lch(hex2lab(i.hex))})).filter(x=>x.lch[1]>=20&&x.lch[0]>20);
  const hues=[];chrom.forEach(x=>{if(!hues.some(h=>hueDiff(h.h,x.lch[2])<28))hues.push({h:x.lch[2],fam:colorFamily(x.i.hex),i:x.i})});
  let hs,hr;
  if(hues.length===0){hs=78;hr={key:'r_h_neutral',good:true,params:{acc:(()=>{const c=P.find(c=>c.fam==='rosa'&&c.gi===1)||P[0];return L(c.name)})()}}}
  else if(hues.length===1){hs=96;hr={key:'r_h_one',good:true,params:{fam:famName(hues[0].fam).toLowerCase()}}}
  else if(hues.length===2){const d=hueDiff(hues[0].h,hues[1].h),a=L(FAM_NAME[hues[0].fam]).toLowerCase(),b=L(FAM_NAME[hues[1].fam]).toLowerCase();
    if(d<65){hs=90;hr={key:'r_h_analog',good:true,params:{a,b}}}else if(d>=140){hs=84;hr={key:'r_h_compl',good:true,params:{a,b}}}else{hs=70;hr={key:'r_h_mid',good:true,params:{a,b}}}}
  else{hs=Math.max(20,55-(hues.length-3)*15);hr={key:'r_h_busy',good:false,params:{n:hues.length}}}
  add('harmony',hs,0.2,hs>=70);hr.imp=Math.abs(hs-60)+10;R.push(hr);
  // 3. contrasto
  const tops=items.filter(i=>i.cat==='top'||i.cat==='dress'),bots=items.filter(i=>i.cat==='bottom');
  if(tops.length&&bots.length&&prof){
    const dl=Math.round(Math.abs(hex2lab(tops[0].hex)[0]-hex2lab(bots[0].hex)[0])),lv=prof.contrastLevel,tgt=lv==='high'?38:lv==='mid'?22:9;
    const cs=Math.max(0,100-Math.abs(dl-tgt)*2.2),good=cs>=60;
    add('contrast',cs,0.12,good);
    R.push({key:good?'r_c_'+lv:(lv==='high'?'r_c_warn_hi':lv==='low'?'r_c_warn_lo':'r_c_mid'),good,imp:Math.abs(cs-60)+8,params:{dl}});
  }
  // 4. forma
  if(prof&&S.quiz.shape&&S.quiz.shape!=='none'){
    const rules=SHAPE_RULES[S.quiz.shape];let ss=60,rs=[];
    items.forEach(it=>{const g=grp(it);if(!g||!it.cut)return;const r=rules[g];
      if(r.g.includes(it.cut)){ss+=14;rs.push({good:true,it})}else if(r.b.includes(it.cut)){ss-=18;rs.push({good:false,it})}});
    ss=clamp(ss,10,100);add('shape',ss,0.13,ss>=60);
    const pick=rs.find(r=>!r.good)||rs[0];
    if(pick)R.push({key:pick.good?'r_s_good':'r_s_bad',good:pick.good,imp:pick.good?58:80,params:{item:nm(pick.it),cut:t('cut_'+pick.it.cut).toLowerCase(),goal:t('sh_goal_'+S.quiz.shape),shape:t('sh_'+S.quiz.shape).toLowerCase()}});
  }
  // 5. occasione
  if(occ){const bad=items.find(i=>i.occ&&i.occ.length&&!i.occ.includes(occ)&&['top','dress','bottom','outer'].includes(i.cat));
    const os=bad?35:92;add('occ',os,0.1,!bad);
    R.push(bad?{key:'r_o_bad',good:false,imp:78,params:{item:nm(bad),occ:t('occ_'+occ).toLowerCase()}}:{key:'r_o_good',good:true,imp:50,params:{occ:t('occ_'+occ).toLowerCase()}});}
  // 6. meteo
  if(wx){const hasOuter=items.some(i=>i.cat==='outer'),wrongSeason=items.find(i=>i.useSeason&&i.useSeason!=='all'&&wx.season!=='mid'&&i.useSeason!==wx.season&&i.cat!=='bag'&&i.cat!=='acc');
    let ws=88,r;
    if(wrongSeason){ws=22;r={key:'r_w_bad',good:false,imp:70,params:{temp:wx.temp,why:t('r_w_bad_item',{item:nm(wrongSeason),season:t('season_'+(wrongSeason.useSeason))})}}}
    else if(wx.season==='fw'&&!hasOuter&&isComplete(items)){ws=48;r={key:'r_w_bad',good:false,imp:66,params:{temp:wx.temp,why:t('r_w_bad_cold')}}}
    else r={key:'r_w_good',good:true,imp:42,params:{temp:wx.temp,cond:t('wx_'+wx.cond),why:t(wx.season==='fw'?'r_w_cold':wx.season==='ss'?'r_w_warm':'r_w_mild')}};
    add('weather',ws,0.12,ws>=60);R.push(r)}
  // 7. freschezza
  const fresh=items.filter(i=>!['shoes','bag','acc'].includes(i.cat)).map(i=>({i,d:i.last?daysAgo(i.last):null,w:i.wears||0}));

  else if(old){fr=88;frr={key:'r_f_old',good:true,imp:48,params:{item:nm(old.i),d:old.d}}}
  else if(rec){fr=40;frr={key:'r_f_recent',good:false,imp:44,params:{item:nm(rec.i),d:rec.d}}}
  add('fresh',fr,0.05,fr>=60);if(frr)R.push(frr);
  const score=Math.round(total/wsum);
  const text=R.filter(r=>r.key&&r.key.startsWith('r_')&&r.params).sort((a,b)=>(b.imp||0)-(a.imp||0));
  const goods=text.filter(r=>r.good).slice(0,4),warns=text.filter(r=>!r.good).slice(0,2);
  return{score,parts:R.filter(r=>r.w),goods,warns};
}
const renderReason=r=>t(r.key,r.params);
function reasonsHTML(ev,max=4){
  const g=ev.goods.slice(0,max).map(r=>`<li class="ok"><span class="ri">${icon('check',16)}</span><span>${esc(renderReason(r))}</span></li>`).join('');
  const w=ev.warns.map(r=>`<li class="warn"><span class="ri">${icon('warn',16)}</span><span>${esc(renderReason(r))}</span></li>`).join('');

/* ---------- generatore ---------- */
function rank(items,occ,wx,n=12){
  return items.map(i=>({i,s:itemFit(i).score+(occ&&occ!=='any'&&i.occ&&i.occ.includes(occ)?12:0)+((i.wears||0)===0?6:0)})).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.i);
}
function suggest(opts={}){
  const occ=opts.occ||'any',wx=opts.wx||weather(todayStr()),pool=opts.items||S.items;
  const okSeason=i=>!i.useSeason||i.useSeason==='all'||wx.season==='mid'||i.useSeason===wx.season||['bag','acc'].includes(i.cat);
  const by=c=>{const a=pool.filter(i=>i.cat===c),b=a.filter(okSeason);return b.length?b:a};
  const fitOcc=i=>occ==='any'||!i.occ||!i.occ.length||i.occ.includes(occ);
  const tops=rank(by('top').filter(fitOcc),occ,wx,9),bots=rank(by('bottom').filter(fitOcc),occ,wx,9),dresses=rank(by('dress').filter(fitOcc),occ,wx,6);
  const outers=[null].concat(rank(by('outer').filter(fitOcc),occ,wx,4)),shoes=[null].concat(rank(by('shoes'),occ,wx,4)),bags=[null].concat(rank(by('bag'),occ,wx,2)),accs=[null].concat(rank(by('acc'),occ,wx,2));
  const combos=[];
  const bases=[];
  tops.forEach(a=>bots.forEach(b=>bases.push([a,b])));dresses.forEach(d=>bases.push([d]));
  bases.forEach(b=>{
    const pre=evaluate(b,{occ,wx}).score;combos.push({base:b,pre});
  });
  combos.sort((a,b)=>b.pre-a.pre);
  const out=[];
  combos.slice(0,10).forEach(c=>{
    let best=null;
    outers.forEach(o=>shoes.forEach(s=>{
      const items=c.base.concat(o?[o]:[],s?[s]:[]);
      const ev=evaluate(items,{occ,wx});if(!best||ev.score>best.ev.score)best={items,ev};
    }));
    // borsa e accessorio: il migliore per palette
    const bag=bags[1]?bags.slice(1).sort((a,b)=>itemFit(b).score-itemFit(a).score)[0]:null,acc=accs[1]?accs.slice(1).sort((a,b)=>itemFit(b).score-itemFit(a).score)[0]:null;
    const items=best.items.concat(bag&&itemFit(bag).level!=='off'?[bag]:[],acc&&itemFit(acc).level!=='off'?[acc]:[]);
    const ev=evaluate(items,{occ,wx});
    out.push({items,ev});
  });
  out.sort((a,b)=>b.ev.score-a.ev.score);
  const seen=new Set(),res=[];
  out.forEach(o=>{const k=o.items[0].id;if(!seen.has(k)||res.length<2){seen.add(k);res.push(o)}});
  return res;
}
function itemsToSlots(items){const s={};items.forEach(i=>{s[slotOf(i)]=i.id});return s}

/* ---------- armadio: filtri ---------- */
function filterItems(){
  const c=S.closet,f=c.f,q=c.q.trim().toLowerCase(),P=mySeason();
  let r=S.items.filter(i=>{
    if(c.cat!=='all'&&i.cat!==c.cat)return false;
    if(q&&!(nm(i)+' '+(i.brand||'')+' '+(i.fabric||'')+' '+(i.notes||'')).toLowerCase().includes(q))return false;
    if(f.cs){if(f.cs==='off'){if(itemFit(i).level!=='off')return false}else{const sid=f.cs==='mine'?P:f.cs;if(paletteFit(i.hex,sid).dE>11)return false}}
    if(f.us&&i.useSeason!==f.us&&i.useSeason!=='all')return false;
    if(f.fam&&colorFamily(i.hex)!==f.fam)return false;
    if(f.brand&&(i.brand||'')!==f.brand)return false;
    if(f.fabric&&(i.fabric||'').toLowerCase()!==f.fabric.toLowerCase())return false;
    if(f.cut&&i.cut!==f.cut)return false;
    if(f.occ&&!(i.occ||[]).includes(f.occ))return false;
    if(f.worn==='never'&&(i.wears||0)>0)return false;
    if(f.worn==='often'&&(i.wears||0)<5)return false;
    return true});
  const cpw=i=>i.price&&i.wears?i.price/i.wears:(i.price?1e6:1e7);
  const so=f.sort||'recent';
  r.sort((a,b)=>so==='fit'?itemFit(b).score-itemFit(a).score:so==='cpw'?cpw(a)-cpw(b):so==='name'?nm(a).localeCompare(nm(b)):so==='wears'?(b.wears||0)-(a.wears||0):b.added-a.added);
  return r;
}

/* ---------- chat IconicAI ---------- */
function aiRespond(q){
  const s=q.toLowerCase(),P=S.profile,out=[];
  const has=(...w)=>w.some(x=>s.includes(x));
  const prof=P;
  const outfitFor=occ=>{
    const wx=weather(todayStr()),res=suggest({occ,wx});
    if(!res.length)return{text:t('ai_noout')};
    const r=res[0];return{text:t('ai_outfit',{occ:t('occ_'+occ).toLowerCase()}),outfit:{occ,items:r.items.map(i=>i.id),score:r.ev.score,reasons:r.ev.goods.slice(0,3).concat(r.ev.warns.slice(0,1)).map(x=>({key:x.key,params:x.params,good:x.good}))}};
  };
  if(has('grazie','thanks','thank'))return{text:t('ai_thanks')};
  if(has('stasera','sera','evening','tonight','aperitivo','cena','dinner','party','festa'))return outfitFor('evening');
  if(has('lavoro','work','ufficio','office','meeting'))return outfitFor('work');
  if(has('formale','formal','cerimonia','matrimonio','wedding'))return outfitFor('formal');
  if(has('oggi','today','outfit','metto','wear','casual','proponi','suggest'))return outfitFor('casual');
  if(has('evit','avoid','sbagliat','wrong','non mi stanno','bad color'))return{text:t('ai_avoid',{list:avoidColors(P.season,5).map(c=>L(c.name)).join(', '),opp:seasonName(oppositeSeason(P.season))})};
  if(has('oro','argento','gold','silver','gioiell','jewel','metall'))return{text:t('ai_metal',{mt:t('mt_'+P.metals),pref:S.quiz.metal?t('m_'+S.quiz.metal):'—'})};
  if(has('forma','corpo','body','shape','silhouette','taglio','cut','valoriz','flatter'))return{text:t('ai_shape',{shape:t('sh_'+(S.quiz.shape||'none')).toLowerCase(),goal:t('sh_goal_'+(S.quiz.shape||'none')),do:t('sh_do_'+(S.quiz.shape||'none')).split('|').join('; '),av:t('sh_av_'+(S.quiz.shape||'none')).split('|').join('; ')})};
  if(has('manca','mancano','compr','buy','missing','shopping','need','serve'))return missing();
  if(has('mai indoss','never','non ho mai','rivalut','unused'))return never();
  if(has('contrast'))return{text:t('ai_contrast',{lvl:t('lvl_'+P.contrastLevel),c:P.contrast,adv:t('ai_con_'+P.contrastLevel)})};
  if(has('trucc','makeup','rossetto','lipstick','blush','ombretto'))return makeup();
  if(has('palette','colori','colors','colours','tavolozza'))return{text:t('ai_palette',{list:revealColors(P.season).map(c=>L(c.name)+' '+c.hex).join(', ')})};
  if(has('perché','perche','why','stagione','season','sottotono','undertone','assoluto','absolute'))return why();
  return{text:t('ai_fallback')};
  function why(){
    const lab=v=>(v>=0?'+':'')+Math.round(v*100);
    const dom=P.isAbs?t('ax_desc_A'):t('ax_desc_'+['T','V','C'][P.dom]);
    return{text:t('ai_why',{season:seasonName(P.season),T:lab(P.T),V:lab(P.V),C:lab(P.C),dom:dom.charAt(0).toUpperCase()+dom.slice(1)})};
  }
  function missing(){
    const P2=pal().filter(c=>c.gi!==2&&c.fam!=='neutri'),have=c=>S.items.some(i=>['top','dress','outer','acc'].includes(i.cat)&&deltaE00(hex2lab(i.hex),hex2lab(c.hex))<9);
    const gone=P2.filter(c=>!have(c)).slice(0,5);
    return{text:gone.length?t('ai_missing',{list:gone.map(c=>L(c.name)).join(', ')}):t('ai_nomiss')};
  }
  function never(){
    const n=S.items.filter(i=>!(i.wears>0));
    return{text:n.length?t('ai_never',{list:n.slice(0,6).map(nm).join(', '),tip:t('ai_never_tip')}):t('ai_never_none')};
  }
  function makeup(){
    const p=pal(),lip=p.find(c=>c.fam==='rosso'&&c.gi===1),bl=p.find(c=>c.fam==='rosa'&&c.gi===0),ey=p.find(c=>c.fam==='marrone'&&c.gi===1);
    return{text:t('ai_makeup',{lip:L(lip.name)+' '+lip.hex,blush:L(bl.name)+' '+bl.hex,eye:L(ey.name)+' '+ey.hex})};
  }
}

/* ---------- confetti ---------- */
function confetti(colors){
  const cv=$('#confetti'),ph=$('#phone');if(!cv)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  cv.width=ph.clientWidth*devicePixelRatio;cv.height=ph.clientHeight*devicePixelRatio;const c=cv.getContext('2d'),W=cv.width,H=cv.height,dpr=devicePixelRatio;
  const ps=[];const src=[[.5,.4,0,1],[.04,.78,1,.9],[.96,.78,-1,.9]];
  for(let i=0;i<260;i++){const o=src[i%3],sp=o[2]===0?(Math.random()-.5)*15:o[2]*(3+Math.random()*10);
    ps.push({x:W*o[0]+(Math.random()-.5)*20*dpr,y:H*o[1],vx:sp*dpr,vy:(-Math.random()*16*o[3]-6)*dpr,r:(5+Math.random()*8)*dpr,col:colors[i%colors.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,t:Math.floor(Math.random()*3),life:0})}
  let f=0;cv.style.display='block';
  (function loop(){c.clearRect(0,0,W,H);f++;let alive=0;
    ps.forEach(p=>{p.vy+=0.26*dpr;p.vx*=.99;p.vy*=.995;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;if(p.y<H+30){alive++;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;c.strokeStyle='rgba(42,24,64,.7)';c.lineWidth=1.2*dpr;
      if(p.t===0){c.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);c.strokeRect(-p.r/2,-p.r/4,p.r,p.r/2)}else if(p.t===1){c.beginPath();c.arc(0,0,p.r/2,0,7);c.fill();c.stroke()}else{c.beginPath();for(let k=0;k<8;k++){const rr=k%2?p.r*.25:p.r*.7,a=k*Math.PI/4;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath();c.fill();c.stroke()}
      c.restore()}});
    if(alive&&f<600)requestAnimationFrame(loop);else{c.clearRect(0,0,W,H);cv.style.display='none'}})();
}

function swapIdeas(items,ev){
  const wx=weather(todayStr()),out=[];
  items.forEach(cur=>{
    if(!['top','bottom','dress','outer','shoes'].includes(cur.cat))return;
    let best=null;
    S.items.filter(i=>i.cat===cur.cat&&i.id!==cur.id).slice(0,40).forEach(c=>{const ni=items.map(x=>x.id===cur.id?c:x),e=evaluate(ni,{occ:S.studio.occ,wx});const g=e.score-ev.score;if(g>=4&&(!best||g>best.gain))best={slot:slotOf(cur),id:c.id,hex:c.hex,name:nm(c),gain:g}});
    if(best)out.push(best)});
  return out.sort((a,b)=>b.gain-a.gain).slice(0,3);
}

  const q=S.quiz,e=EYES.find(x=>x.id===q.eyes),h=HAIRS.find(x=>x.id===q.hair),tp=(e.T*0.45+h.T*0.25)/0.7;

  /* ordine: si parte dall'asse meno deciso — se occhi e capelli sono ambigui, dal drappo più contrastato (vivo); se già decisi, dal sottile (neutro) */
  UI.drapeOrder=Math.abs(tp)<0.3?[0,2,1]:[1,2,0];
  UI.drapeSwap=[Math.random()<.5?1:0,Math.random()<.5?1:0,Math.random()<.5?1:0];
}
function finishQuiz(){
  const q=S.quiz;
  const drape=[0,0,0];UI.drapeOrder.forEach((idx,n)=>{drape[idx]=q.drape[n]||0});
  const p=computeProfile({skin:q.skin,eyes:q.eyes,hair:q.hair,drape});
  p.metalPref=q.metal;S.profile=p;UI.pending=p;
  S.items=S.items.filter(i=>!i.demo);S.seeded=false;S.outfits=[];S.plan={};S.chat=[];S.studio={slots:{},occ:'any'};UI.sugKey='';
  go('analyzing');
}
function openSheet(html,cls=''){
  closeSheet(true);
  const sh=document.createElement('div');sh.id='sheet';sh.className='sheet '+cls.split(' ').filter(Boolean).map(c=>'sh-'+c).join(' ');
  sh.innerHTML=`<div class="backdrop" data-act="closeSheet"></div><div class="panel"><div class="grab"></div><button class="xbtn" data-act="closeSheet" aria-label="${t('close')}">${icon('x',16)}</button><div class="pbody">${html}</div></div>`;
  $('#phone').appendChild(sh);requestAnimationFrame(()=>sh.classList.add('open'));UI.sheet=cls||true;
}
function reSheet(html){const b=$('#sheet .pbody');if(b)b.innerHTML=html}
function closeSheet(now){const sh=$('#sheet');if(!sh)return;UI.sheet=null;if(now){sh.remove();return}sh.classList.remove('open');setTimeout(()=>sh.remove(),260)}
function wearItems(ids,ds){
  const now=Date.now(),d=ds?parseD(ds).getTime()+12*3600000:now;
  ids.forEach(id=>{const it=S.items.find(i=>i.id===id);if(it){it.wears=(it.wears||0)+1;it.last=Math.min(d,now)}});
}
function refreshView(){const v=$('#view');if(v&&S.screen==='app'){const st=v.scrollTop;const f=document.activeElement;v.innerHTML=({today:vToday,closet:vCloset,studio:vStudio,cal:vCal,ai:vAI}[S.tab])();v.scrollTop=st;if(S.tab==='ai'){const c=$('#chat');if(c)c.scrollTop=c.scrollHeight}}}
function showColor(arg){
  const [hex,name,fam,grade]=arg.split('|'),box=$('#colorInfo');if(!box)return;
  const lch=lab2lch(hex2lab(hex));
  box.innerHTML=`<span class="cdot2 big" style="background:${hex}"></span><div><b>${name}</b><small>${hex.toUpperCase()} · L*${lch[0].toFixed(0)} C*${lch[1].toFixed(0)} h${lch[2].toFixed(0)}°</small><p>${famName(fam)} · ${t('grade_'+grade)}</p></div>`;box.classList.add('on');
}
function setBind(path,val){
  if(path==='name'){S.name=val;persist();return}
  if(path==='q'){S.closet.q=val;persist();const g=$('.grid.items');if(g)g.innerHTML=gridHTML(filterItems());return}
  if(path==='theme'){S.theme=val?'dark':'light';applyTheme();persist();return}
  if(path.startsWith('f.')){const k=path.slice(2);if(val)S.closet.f[k]=val;else delete S.closet.f[k];persist();const b=$('#sheet .btnrow .btn');if(b)b.textContent=t('done')+' ('+filterItems().length+')';refreshView();return}
  if(path.startsWith('form.')){
    const k=path.slice(5);
    if(k==='hex'){setHex(val,true);return}
    if(k==='hexT'){if(/^#[0-9a-fA-F]{6}$/.test(val))setHex(val.toLowerCase());return}
    if(k==='price'){UI.form.price=parseFloat(val)||0;return}
    if(k==='wb'){UI.form.wb=val;return}
    UI.form[k]=val;
    if(k==='cat'){UI.form.kind=(KINDS[val]||[''])[0];reSheet(sheetForm())}
  }
}
function setHex(h,fromPicker){
  UI.form.hex=h;const c=$('#colorIn'),x=$('#hexIn'),lf=$('#liveFit');
  if(c&&!fromPicker)c.value=h;if(x&&document.activeElement!==x)x.value=h;
  const f=itemFit({hex:h});if(lf)lf.textContent=t('f_live',{c:L(f.color.name),d:f.dE.toFixed(1),fit:t('fit_'+f.level)});
}
/* foto: ridimensiona, estrai colore dominante, correggi bianco */
function loadPhoto(file){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{
    const M=320,sc=Math.min(1,M/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);UI.formCanvas=cv;UI.form.img=cv.toDataURL('image/jpeg',.78);
    sampleAt(null);const ph=$('#ph');if(ph)ph.innerHTML=`<img id="phimg" src="${UI.form.img}" alt="">`;};im.src=fr.result};fr.readAsDataURL(file);
}
function sampleAt(pt){
  const cv=UI.formCanvas;if(!cv)return;const c=cv.getContext('2d'),W=cv.width,H=cv.height;
  let x0,y0,w,h;if(pt){const r=7;x0=clamp(Math.round(pt.x*W)-r,0,W-1);y0=clamp(Math.round(pt.y*H)-r,0,H-1);w=Math.min(2*r,W-x0);h=Math.min(2*r,H-y0)}else{x0=Math.round(W*.3);y0=Math.round(H*.3);w=Math.round(W*.4);h=Math.round(H*.4)}
  const d=c.getImageData(x0,y0,Math.max(1,w),Math.max(1,h)).data;let r=0,g=0,b=0,n=0;
  for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);if(!pt&&mx>245&&mx-mn<12)continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++}
  if(!n){n=1}r/=n;g/=n;b/=n;
  if(UI.form.wb){const all=c.getImageData(0,0,W,H).data;let R=0,G=0,B=0,k=0;for(let i=0;i<all.length;i+=16){R+=all[i];G+=all[i+1];B+=all[i+2];k++}R/=k;G/=k;B/=k;const gr=(R+G+B)/3;r=clamp(r*gr/R,0,255);g=clamp(g*gr/G,0,255);b=clamp(b*gr/B,0,255)}
  setHex(toHex([r/255,g/255,b/255]));
}
function newForm(it){
  UI.form=it?Object.assign({},it,{occ:(it.occ||[]).slice(),name:typeof it.name==='object'?L(it.name):it.name}):{cat:'top',kind:'top',hex:pal().find(c=>c.fam==='neutri'&&c.gi===0).hex,occ:['casual'],useSeason:'all',wb:false};
  UI.formCanvas=null;
}
function saveItemForm(){
  const f=UI.form;if(!f.name||!String(f.name).trim()){const n=$('[data-bind="form.name"]');if(n){n.classList.add('shake');n.focus()}return}
  const it={id:f.id||nid(),cat:f.cat,kind:f.kind||f.cat,name:String(f.name).trim(),hex:f.hex,brand:f.brand||'',fabric:f.fabric||'',price:f.price||0,size:f.size||'',cut:f.cut||'',useSeason:f.useSeason||'all',occ:f.occ||[],wears:f.wears||0,last:f.last||null,notes:f.notes||'',img:f.img||null,added:f.added||Date.now(),demo:false};
  const i=S.items.findIndex(x=>x.id===it.id);if(i>=0)S.items[i]=it;else S.items.unshift(it);
  UI.sugKey='';persist();closeSheet();refreshView();toast(t('done'));
}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function act(a,arg,el,ev){
  switch(a){
    case 'lang':setLang(LANG==='it'?'en':'it');UI.sugKey='';render(false);if(UI.sheet==='profile')reSheet(sheetProfile());else if(UI.sheet)closeSheet(true);break;
    case 'start':S.quiz={skin:null,eyes:null,hair:null,metal:null,drape:[null,null,null],shape:null};go('q-skin');break;
    case 'go':go(arg);break;
    case 'pick':{const [k,v]=arg.split(':');S.quiz[k]=v;persist();
      if(k==='shape'&&v==='none'){finishQuiz();break}
      render(false);if(k==='metal'||k==='shape'){}break}
    case 'next':{const i=STEPS.indexOf(S.screen);go(STEPS[i+1]);break}
    case 'drape':{const n=UI.drapeIdx;S.quiz.drape[n]=parseInt(arg);persist();
      const row=$('.dpair');if(row)row.classList.add('swapout');
      setTimeout(()=>{if(n>=2)go('q-shape');else{UI.drapeIdx=n+1;render(false)}},260);break}
    case 'finish':finishQuiz();break;
    case 'color':showColor(arg);break;
    case 'share':openShare();break;
    case 'dl':download('iconic-closet-'+S.profile.season+'.png',dataURLtoBlob(UI.cardURL));break;
    case 'shareNative':{UI.cardCanvas.toBlob(async b=>{const file=new File([b],'iconic-closet.png',{type:'image/png'});
      try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],text:shareText()});else if(navigator.share)await navigator.share({text:shareText()});else download('iconic-closet.png',b)}catch(e){}});break}
    case 'copytxt':{const tx=shareText();(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).catch(()=>{}).finally(()=>toast(t('sh_copied')));break}
    case 'enter':seedDemo();S.tab='today';go('app');break;
    case 'profile':UI.sheet='profile';openSheet(sheetProfile(),'full profile');UI.sheet='profile';break;
    case 'retake':closeSheet();S.quiz={skin:null,eyes:null,hair:null,metal:null,drape:[null,null,null],shape:null};go('q-skin');break;
    case 'tab':S.tab=arg;persist();render(false);{const c=$('#chat');if(c)c.scrollTop=c.scrollHeight}break;
    case 'occ':S.occ=arg;persist();refreshView();break;
    case 'otherSug':UI.sugIdx++;refreshView();break;
    case 'wearSug':{const s=getSug()[UI.sugIdx%getSug().length];if(s){wearItems(s.items.map(i=>i.id));const ds=todayStr();S.plan[ds]={items:s.items.map(i=>i.id),worn:true,occ:S.occ};persist();UI.sugKey='';refreshView();toast(t('worn_ok'))}break}
    case 'sugToStudio':{const s=getSug()[UI.sugIdx%getSug().length];if(s){S.studio.slots=itemsToSlots(s.items);S.studio.occ=S.occ;S.tab='studio';persist();render(false)}break}
    case 'cat':S.closet.cat=arg;persist();refreshView();break;
    case 'filters':openSheet(sheetFilters(),'filters');break;
    case 'fam':{const f=S.closet.f;if(f.fam===arg)delete f.fam;else f.fam=arg;persist();reSheet(sheetFilters());refreshView();break}
    case 'unf':delete S.closet.f[arg];persist();refreshView();break;
    case 'clrf':S.closet.f={};persist();refreshView();break;
    case 'clrf2':S.closet.f={};persist();reSheet(sheetFilters());refreshView();break;
    case 'item':openSheet(sheetItem(arg),'item');break;
    case 'addItem':newForm();openSheet(sheetForm(),'form');break;
    case 'editItem':{const it=S.items.find(i=>i.id===arg);newForm(it);openSheet(sheetForm(),'form');break}
    case 'delItem':if(confirm(t('it_del_confirm'))){S.items=S.items.filter(i=>i.id!==arg);Object.values(S.studio.slots).forEach(()=>{});for(const k in S.studio.slots)if(S.studio.slots[k]===arg)delete S.studio.slots[k];UI.sugKey='';persist();closeSheet();refreshView()}break;
    case 'saveItem':saveItemForm();break;
    case 'setHex':setHex(arg);break;
    case 'formOcc':{const o=UI.form.occ||(UI.form.occ=[]);const i=o.indexOf(arg);i>=0?o.splice(i,1):o.push(arg);el.classList.toggle('on');break}
    case 'photoTap':{const im=$('#phimg');if(!im||!UI.formCanvas){const f=$('#file');if(f)f.click();break}const r=im.getBoundingClientRect();sampleAt({x:(ev.clientX-r.left)/r.width,y:(ev.clientY-r.top)/r.height});break}
    case 'wearItem':{wearItems([arg]);persist();UI.sugKey='';reSheet(sheetItem(arg));refreshView();toast(t('worn_ok'));break}
    case 'itemStudio':{const it=S.items.find(i=>i.id===arg);S.studio.slots={};S.studio.slots[slotOf(it)]=it.id;S.tab='studio';persist();closeSheet();render(false);break}
    case 'stocc':S.studio.occ=arg;persist();refreshView();break;
    case 'slot':{const [sl,id]=arg.split(':'),s=S.studio.slots;if(s[sl]===id)delete s[sl];else{s[sl]=id;const it=S.items.find(i=>i.id===id);if(it.cat==='dress')delete s.bottom;if(sl==='bottom'&&s.main){const m=S.items.find(i=>i.id===s.main);if(m&&m.cat==='dress')delete s.main}}persist();refreshView();break}
    case 'swap':{const [sl,id]=arg.split(':');S.studio.slots[sl]=id;persist();refreshView();break}
    case 'stClear':S.studio.slots={};persist();refreshView();break;
    case 'stGen':{const r=suggest({occ:S.studio.occ,wx:weather(todayStr())});if(r.length){const pick=r[Math.floor(Math.random()*Math.min(4,r.length))];S.studio.slots=itemsToSlots(pick.items)}persist();refreshView();break}
    case 'stSave':{const items=studioItems(),n=($('#ofname')||{}).value||(LANG==='it'?'Outfit ':'Outfit ')+(S.outfits.length+1);S.outfits.unshift({id:nid(),name:n,items:items.map(i=>i.id),occ:S.studio.occ});persist();refreshView();toast(t('st_saved_ok'));break}
    case 'ofLoad':{const o=S.outfits.find(x=>x.id===arg);S.studio.slots=itemsToSlots(o.items.map(id=>S.items.find(i=>i.id===id)).filter(Boolean));persist();refreshView();$('#view').scrollTop=0;break}
    case 'ofDel':S.outfits=S.outfits.filter(o=>o.id!==arg);persist();refreshView();break;
    case 'ofPlan':{S.tab='cal';persist();render(false);UI.pendingOutfit=arg;toast(t('cal_pick'));break}
    case 'calPrev':{const c=UI.cal;c.m--;if(c.m<0){c.m=11;c.y--}refreshView();break}
    case 'calNext':{const c=UI.cal;c.m++;if(c.m>11){c.m=0;c.y++}refreshView();break}
    case 'day':{if(UI.pendingOutfit){const o=S.outfits.find(x=>x.id===UI.pendingOutfit);UI.pendingOutfit=null;if(o){S.plan[arg]={items:o.items.slice(),worn:false,occ:o.occ||'any'};persist();refreshView()}}
      UI.calSel=arg;openSheet(sheetDay(arg),'day');break}
    case 'dayOcc':{const [ds,o]=arg.split(':');S.plan[ds]=S.plan[ds]||{items:[],worn:false};S.plan[ds].occ=o;persist();reSheet(sheetDay(ds));break}
    case 'dayPick':{const [ds,id]=arg.split(':'),o=S.outfits.find(x=>x.id===id);S.plan[ds]=Object.assign(S.plan[ds]||{},{items:o.items.slice(),worn:false});persist();reSheet(sheetDay(ds));refreshView();break}
    case 'daySug':{const [ds,k]=arg.split(':'),pl=S.plan[ds],s=suggest({occ:(pl&&pl.occ)||'any',wx:weather(ds)})[+k];if(s){S.plan[ds]=Object.assign(pl||{},{items:s.items.map(i=>i.id),worn:false});persist();reSheet(sheetDay(ds));refreshView()}break}
    case 'dayWear':{const pl=S.plan[arg];if(pl&&!pl.worn){wearItems(pl.items,arg);pl.worn=true;persist();UI.sugKey='';reSheet(sheetDay(arg));refreshView();toast(t('worn_ok'))}break}
    case 'dayDel':delete S.plan[arg];persist();closeSheet();refreshView();break;
    case 'planWeek':planWeek();break;
    case 'ask':askAI(t('ai_q'+arg),arg);break;
    case 'aiWear':{const ids=arg.split(',');wearItems(ids);S.plan[todayStr()]={items:ids,worn:true,occ:'any'};persist();UI.sugKey='';toast(t('worn_ok'));break}
    case 'aiStudio':{const its=arg.split(',').map(id=>S.items.find(i=>i.id===id)).filter(Boolean);S.studio.slots=itemsToSlots(its);S.tab='studio';persist();render(false);break}
    case 'copyhex':{(navigator.clipboard?navigator.clipboard.writeText(arg):Promise.reject()).catch(()=>{});toast(t('hex_copied',{hex:arg.toUpperCase()}));break}
    case 'export':download('iconic-closet-backup.json',new Blob([JSON.stringify({v:2,s:S},null,1)],{type:'application/json'}));toast(t('exp_ok'));break;
    case 'rmDemo':S.items=S.items.filter(i=>!i.demo);S.studio.slots={};UI.sugKey='';persist();toast(t('done'));reSheet(sheetProfile());break;
    case 'reset':if(confirm(t('pf_reset_confirm'))){const l=LANG;localStorage.removeItem(KEY);S=DEFAULT();S.lang=l;UI.sugKey='';closeSheet(true);go('welcome')}break;
    case 'closeSheet':closeSheet();break;
  }
}
function dataURLtoBlob(u){const [h,b]=u.split(',');const m=h.match(/:(.*?);/)[1],bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})}
function planWeek(){
  const start=new Date();let recent=[];
  for(let k=0;k<7;k++){
    const d=new Date(start.getTime()+k*DAY),ds=todayStr(d),dow=(d.getDay()+6)%7,occ=S.plan[ds]&&S.plan[ds].occ?S.plan[ds].occ:(dow<5?'work':'casual');
    if(S.plan[ds]&&S.plan[ds].worn)continue;
    const cand=suggest({occ,wx:weather(ds)}),pick=cand.find(c=>!c.items.some(i=>recent.slice(-3).flat().includes(i.id)&&['top','dress','bottom'].includes(i.cat)))||cand[0];
    if(pick){S.plan[ds]={items:pick.items.map(i=>i.id),worn:false,occ};recent.push(pick.items.filter(i=>['top','dress','bottom'].includes(i.cat)).map(i=>i.id))}
  }
  persist();refreshView();toast(t('cal_week_ok'));
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='LABEL'&&e.target.tagName==='INPUT')return;
  act(el.dataset.act,el.dataset.arg,el,e);
});
document.addEventListener('input',e=>{const b=e.target.dataset&&e.target.dataset.bind;if(!b)return;
  if(e.target.type==='checkbox')return;
  if(e.target.tagName==='SELECT')return;
  setBind(b,e.target.value)});
document.addEventListener('change',e=>{
  const el=e.target,b=el.dataset&&el.dataset.bind;
  if(b){if(el.type==='checkbox')setBind(b,el.checked);else if(el.tagName==='SELECT'||el.type==='color')setBind(b,el.value)}
  if(el.id==='file'&&el.files[0])loadPhoto(el.files[0]);
  if(el.id==='impFile'&&el.files[0]){el.files[0].text().then(tx=>{try{const j=JSON.parse(tx);if(j.v!==2||!j.s)throw 0;S=Object.assign(DEFAULT(),j.s);setLang(S.lang);persist();UI.sugKey='';closeSheet(true);go(S.profile?'app':'welcome',false);toast(t('imp_ok'))}catch(er){toast(t('imp_err'))}})}
});
document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();const i=$('#chatText');const v=i.value;i.value='';askAI(v)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.id==='nameIn'){e.preventDefault();act('start')}});

function clock(){const d=new Date(),el=$('#clock');if(el)el.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function boot(){
  load();LANG=S.lang||'it';setLang(LANG);
  if(!S.profile&&!['welcome','q-skin','q-eyes','q-hair','q-metal','q-drape','q-shape'].includes(S.screen))S.screen='welcome';
  if(S.screen==='q-drape')setupDrape();
  if(S.screen==='analyzing'||(S.screen==='reveal'&&!S.profile))S.screen=S.profile?'reveal':'welcome';
  if(S.profile&&S.screen==='welcome'){}
  clock();setInterval(clock,20000);render(true);
  const q=new URLSearchParams(location.search);if(q.get('lang'))setLang(q.get('lang'));
}
window.addEventListener('DOMContentLoaded',boot);
</script>
